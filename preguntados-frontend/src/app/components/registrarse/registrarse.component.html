<section>
  <div class="container">

    <div class="row justify-content-center">
      <div class="col-lg-10">

        <p-card styleClass="user-form">

          <form [formGroup]="registerForm" (ngSubmit)="register()">

            <!-- PASO 1 -->
            <div *ngIf="step === 1">

              <h4 class="mb-3">Cargar Datos Personales</h4>

              <!-- Nombre + Apellido -->
              <div class="row">
                <div class="col-md-6">
                  <label class="labelForm">Nombre</label>
                  <input type="text" pInputText formControlName="nombre" class="w-100">
                </div>

                <div class="col-md-6">
                  <label class="labelForm">Apellido</label>
                  <input type="text" pInputText formControlName="apellido" class="w-100">
                </div>
              </div>

              <br>

              <!-- Sexo + Documento -->
              <div class="row">
                <div class="col-md-4">
                  <label class="labelForm">Sexo</label>
                  <select class="form-control" formControlName="sexo">
                    <option value="">Seleccione</option>
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                    <option value="X">No Binario</option>
                  </select>
                </div>

                <div class="col-md-4">
                  <label class="labelForm">Tipo Doc</label>
                  <select class="form-control" formControlName="tipoDocumento">
                    <option value="1">DNI</option>
                    <option value="2">Pasaporte</option>
                  </select>
                </div>

                <div class="col-md-4">
                  <label class="labelForm">Número</label>
                  <input type="text" pInputText formControlName="numeroDocumento" class="w-100">
                </div>
              </div>

              <br>

              <!-- DOMICILIO -->
              <h5>Domicilio</h5>

              <div class="row">

                <div class="col-md-4">
                  <label class="labelForm">Provincia</label>
                  <select class="form-control"
                          formControlName="provincia"
                          (change)="onProvinciaChange()">
                    <option value="">Seleccione</option>
                    <option *ngFor="let p of provincias" [value]="p.id">
                      {{ p.nombre }}
                    </option>
                  </select>
                </div>

                <div class="col-md-4">
                  <label class="labelForm">Departamento</label>
                  <select class="form-control"
                          formControlName="departamento"
                          (change)="onDepartamentoChange()">
                    <option value="">Seleccione</option>
                    <option *ngFor="let d of departamentos" [value]="d.id">
                      {{ d.nombre }}
                    </option>
                  </select>
                </div>

                <div class="col-md-4">
                  <label class="labelForm">Localidad</label>
                  <select class="form-control" formControlName="localidad">
                    <option value="">Seleccione</option>
                    <option *ngFor="let l of localidades" [value]="l.nombre">
                      {{ l.nombre }}
                    </option>
                  </select>
                </div>

              </div>

              <br>

              <!-- Calle + Número -->
              <div class="row">
                <div class="col-md-8">
                  <label class="labelForm">Calle</label>

                  <p-autoComplete
                    formControlName="calle"
                    [suggestions]="callesFiltradas"
                    (completeMethod)="buscarCalles($event)"
                    field="nombre"
                    [dropdown]="true"
                    [forceSelection]="false"
                    placeholder="Escribí la calle..."
                    styleClass="w-100"
                    inputStyleClass="w-100"
                    [inputStyle]="{'text-transform': 'uppercase'}">
                  </p-autoComplete>

                </div>

                <div class="col-md-4">
                  <label class="labelForm">Número</label>

                  <input type="text"
                         pInputText
                         formControlName="numero"
                         class="w-100"
                         [ngClass]="{
                           'ng-invalid ng-dirty': registerForm.get('numero')?.errors?.['direccionInvalida']
                         }">

                  <small *ngIf="registerForm.get('numero')?.errors?.['direccionInvalida'] && registerForm.get('numero')?.touched"
                         class="text-danger">
                    Dirección inválida: la altura supera el máximo permitido
                  </small>

                </div>
              </div>

              <br>

              <!-- CONTACTO -->
              <h5>Contacto</h5>

              <div class="row">
                <div class="col-md-6">
                  <label class="labelForm">Correo electrónico</label>
                  <input type="email" pInputText formControlName="correoElectronico" class="w-100">
                </div>

                <div class="col-md-6">
                  <label class="labelForm">Teléfono</label>
                  <input type="text" pInputText formControlName="telefono" class="w-100">
                </div>
              </div>

              <br>

              <button type="button" class="btn btn-primary w-100" (click)="nextStep()">
                Siguiente
              </button>

            </div>

            <!-- PASO 2 -->
            <div *ngIf="step === 2">

              <h4 class="mb-3 text-center">Crear Usuario</h4>

              <div class="row justify-content-center">
                <div class="col-md-6">

                  <div class="mb-3">
                    <label class="labelForm">Usuario</label>
                    <input type="text" pInputText formControlName="username" class="w-100">
                  </div>

                  <!-- PASSWORD -->
                  <div class="mb-2">
                    <label class="labelForm">Contraseña</label>

                    <p-password
                      formControlName="password"
                      [toggleMask]="true"
                      [feedback]="false"
                      styleClass="w-100"
                      inputStyleClass="w-100">
                    </p-password>

                    <small class="text-danger"
                      *ngIf="registerForm.get('password')?.hasError('weakPassword') && registerForm.get('password')?.touched">
                      Mínimo 8 caracteres, una letra, un número y un carácter especial
                    </small>
                  </div>

                  <!-- REPEAT PASSWORD -->
                  <div class="mb-3">
                    <label class="labelForm">Repetir contraseña</label>

                    <p-password
                      formControlName="repeatPassword"
                      [toggleMask]="true"
                      [feedback]="false"
                      styleClass="w-100"
                      inputStyleClass="w-100">
                    </p-password>
                  </div>

                  <!-- ERROR MATCH -->
                  <div *ngIf="passwordsNoCoinciden()" class="text-danger text-center">
                    Las contraseñas no coinciden
                  </div>

                  <br>
                  <!-- TERMINOS Y CONDICIONES -->
                  <div class="form-check mb-3 text-center">
                  
                    <input
                      type="checkbox"
                      class="form-check-input"
                      id="terminos"
                      formControlName="aceptoTerminos"
                    />
                  
                    <label class="form-check-label" for="terminos">
                      Acepto los términos y condiciones
                    </label>
                  
                  </div>
                  <br>

                  <button type="button" class="btn btn-secondary w-100 mb-2" (click)="prevStep()">
                    Volver
                  </button>

                  <button type="submit"
                          class="btn btn-primary w-100"
                          [disabled]="cargando || registerForm.get('password')?.invalid">
                    Registrarse
                  </button>

                </div>
              </div>

            </div>

            <br><br>

            <div class="text-center">
              <span>¿Ya tenés cuenta?</span>
              <a routerLink="/iniciar-sesion">Iniciar sesión</a>
            </div>

          </form>

        </p-card>

      </div>
    </div>

  </div>
</section>
