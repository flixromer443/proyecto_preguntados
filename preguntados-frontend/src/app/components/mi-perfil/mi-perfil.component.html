<section>
  <div class="container">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-3">

      <button class="btn-back" routerLink="/perfil-jugador">
        <i class="fa-solid fa-arrow-left me-2"></i>
        Volver
      </button>

      <button class="btn-logout" (click)="cerrarSesion()">
        Cerrar sesión
        <i class="fa-solid fa-right-from-bracket ms-2"></i>
      </button>

    </div>

    <h1 class="mb-2">Mi Perfil</h1>
    <p class="text-muted">Gestioná tu información personal</p>

    <p-card class="p-4 shadow-sm">

      <!-- ALERTAS -->
      <div *ngIf="message" class="alert alert-success text-center">
        {{ message }}
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger text-center">
        {{ errorMessage }}
      </div>

      <form [formGroup]="perfilForm">

        <!-- DATOS DE CUENTA -->
        <h5 class="section-title">
          <i class="fa-solid fa-id-card me-2"></i>
          Datos de cuenta
        </h5>

        <div class="row g-3">

          <div class="col-md-4">
            <label class="form-label">Usuario</label>
            <input pInputText formControlName="username"
                   class="w-100"
                   [disabled]="true">
          </div>

          <!-- TIPO DOCUMENTO -->
          <div class="col-md-4">
            <label class="form-label">Tipo documento</label>

            <select class="form-select"
                    formControlName="tipoDocumento"
                    [disabled]="true">

              <option value="1">DNI</option>
              <option value="2">Pasaporte</option>

            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">Número documento</label>
            <input pInputText formControlName="numeroDocumento"
                   class="w-100"
                   [disabled]="true">
          </div>

        </div>

        <div class="row g-3 mt-2">

          <div class="col-md-4">
            <label class="form-label">Sexo</label>
            <select class="form-select"
                    formControlName="sexo"
                    [disabled]="!editando">

              <option value="M">Masculino</option>
              <option value="F">Femenino</option>
              <option value="X">No Binario</option>

            </select>
          </div>

        </div>

        <hr class="my-4">

        <!-- DATOS PERSONALES -->
        <h5 class="section-title">
          <i class="fa-solid fa-user me-2"></i>
          Datos personales
        </h5>

        <div class="row g-3">

          <div class="col-md-6">
            <label class="form-label">Nombre</label>
            <input pInputText formControlName="nombre"
                   class="w-100"
                   [disabled]="!editando">
          </div>

          <div class="col-md-6">
            <label class="form-label">Apellido</label>
            <input pInputText formControlName="apellido"
                   class="w-100"
                   [disabled]="!editando">
          </div>

        </div>

        <hr class="my-4">

        <!-- DOMICILIO -->
        <h5 class="section-title">
          <i class="fa-solid fa-location-dot me-2"></i>
          Domicilio
        </h5>

        <div class="row g-3">

          <div class="col-md-4">
            <label class="form-label">Provincia</label>
            <select class="form-select"
                    formControlName="provincia"
                    [disabled]="!editando"
                    (change)="onProvinciaChange()">

              <option *ngFor="let p of provincias" [value]="p.id">
                {{ p.nombre }}
              </option>

            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">Departamento / Municipio</label>
            <select class="form-select"
                    formControlName="departamento"
                    [disabled]="!editando"
                    (change)="onDepartamentoChange()">

              <option *ngFor="let d of departamentos" [value]="d.id">
                {{ d.nombre }}
              </option>

            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">Localidad</label>
            <select class="form-select"
                    formControlName="localidad"
                    [disabled]="!editando">

              <option *ngFor="let l of localidades" [value]="l.nombre">
                {{ l.nombre }}
              </option>

            </select>
          </div>

        </div>

        <div class="row g-3 mt-2">

          <div class="col-md-8">
            <label class="form-label">Calle</label>

            <p-autoComplete
              formControlName="calle"
              [suggestions]="callesFiltradas"
              (completeMethod)="buscarCalles($event)"
              (onSelect)="seleccionarCalle($event)"
              field="nombre"
              [dropdown]="true"
              class="w-100"
              [disabled]="!editando">
            </p-autoComplete>

          </div>

          <div class="col-md-4">
            <label class="form-label">Número</label>
            <input pInputText formControlName="numero"
                   class="w-100"
                   [disabled]="!editando">

            <small class="text-danger"
              *ngIf="perfilForm.get('numero')?.hasError('alturaInvalida')">
              Altura inválida
            </small>
          </div>

        </div>

        <hr class="my-4">

        <!-- CONTACTO -->
        <h5 class="section-title">
          <i class="fa-solid fa-phone me-2"></i>
          Contacto
        </h5>

        <div class="row g-3">

          <div class="col-md-6">
            <label class="form-label">Teléfono</label>
            <input pInputText formControlName="telefono"
                   class="w-100"
                   [disabled]="!editando">
          </div>

          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input pInputText formControlName="correoElectronico"
                   class="w-100"
                   [disabled]="!editando">
          </div>

        </div>

        <hr class="my-4">

        <!-- BOTONES -->
        <div class="text-center">

          <button pButton type="button"
                  label="Editar"
                  icon="pi pi-pencil"
                  class="p-button-warning me-2"
                  *ngIf="!editando"
                  (click)="toggleEditar()">
          </button>

          <button pButton type="button"
                  label="Cancelar"
                  icon="pi pi-times"
                  class="p-button-secondary me-2"
                  *ngIf="editando"
                  (click)="cancelar()">
          </button>

          <button pButton type="button"
                  label="Guardar cambios"
                  icon="pi pi-check"
                  class="p-button-success"
                  *ngIf="editando"
                  (click)="guardar()">
          </button>

        </div>

      </form>

    </p-card>

  </div>
</section>
